<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS応用課題1</title>
    <link rel="stylesheet" href="jsoyo1.css" />
  </head>
  <body>
    <div class="resalut">
      <p>ラウンド<span id="roundcount">0</span></p>
      <p>プレイヤー1:<span id="p1score">0</span>ポイント</p>
      <p>プレイヤー2:<span id="p2score">0</span> ポイント</p>
    </div>
    <div class="board">
      <p class="player1">プレイヤー1</p>
      <img src="./images/saikoro1.jpg" class="saikoro1" id="saikoroimage1" />
      <img src="./images/saikoro1.jpg" class="saikoro2" id="saikoroimage2" />
      <p class="player2">プレイヤー2</p>
    </div>
    <div class="btn">
      <button type="button" class="battlebtn" id="battlebtn">勝負</button>
      <button type="button" class="resultbtn" id="resultbtn">勝敗</button>
    </div>
    <script src="jsoyo1.js"></script>
  </body>
</html>
