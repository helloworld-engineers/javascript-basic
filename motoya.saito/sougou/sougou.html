<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS総合課題</title>
    <link rel="stylesheet" href="sougou.css" />
  </head>
  <body>
    <div class="main-container">
      <img class="gameover" id="gameoverImg" src="./images/gameover.webp" />
      <div class="filed-container" id="filedImg">
        <p class="status" id="playerStatus"></p>
        <img class="hero-img" id="heroImg" src="./images/hero.png" />
        <img class="currentenemy" id="currentenemyImg" />

        <div class="btn-container">
          <div class="movebtn-container" id="moveBtnContainer">
            <button type="button" class="upbtn" id="upBtn">⇧</button>
            <button type="button" class="rightbtn" id="rightBtn">⇨</button>
            <button type="button" class="downbtn" id="downBtn">⇩</button>
            <button type="button" class="leftbtn" id="leftBtn">⇦</button>
          </div>
          <div class="actionbtn-container" id="actionBtnContainer">
            <button type="button" class="batllebtn" id="batlleBtn">戦う</button>
            <button type="button" class="escapebtn" id="escapeBtn">
              逃げる
            </button>
          </div>
        </div>
      </div>
      <ul class="logcontainer" id="logcontainer">
        <li class="log-title">ログ</li>
      </ul>
    </div>
    <script src="sougou.js"></script>
  </body>
</html>
