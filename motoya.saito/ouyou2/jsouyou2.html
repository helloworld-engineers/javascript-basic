<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS応用課題2</title>
    <link rel="stylesheet" href="jsouyou2.css" />
  </head>
  <body>
    <div class="background">
      <div class="main-container">
        <div class="circle-container" id="circlemain">
          <div class="red-container" id="redContainer">
            <button type="button" class="btnLeft">⇦</button>
            <p class="circle red" id="circleRed"></p>
            <button type="button" class="btnRight">⇨</button>
          </div>
          <div class="blue-container" id="blueContainer">
            <button type="button" class="btnLeft">⇦</button>
            <p class="circle blue" id="circleBlue"></p>
            <button type="button" class="btnRight">⇨</button>
          </div>
          <div class="yellow-container" id="yellowContainer">
            <button type="button" class="btnLeft">⇦</button>
            <p class="circle yellow" id="circleYellow"></p>
            <button type="button" class="btnRight">⇨</button>
          </div>
          <div class="pink-container" id="pinkContainer">
            <button type="button" class="btnLeft">⇦</button>
            <p class="circle pink" id="circlePink"></p>
            <button type="button" id="btnRight">⇨</button>
          </div>
        </div>
        <div class="square-container">
          <p class="square-red" id="squareRed"></p>
          <p class="square-blue" id="squareBlue"></p>
          <p class="square-yellow" id="squareYellow"></p>
          <P class="square-pink" id="squarePink"></P>
        </div>
      </div>
      <p class="text">0個正解しています。</p>
      <button type="button">スタート</button>
      <button type="button" id="resetBtn">リセット</button>
    </div>
    <script src="jsouyou2.js"></script>
  </body>
</html>
