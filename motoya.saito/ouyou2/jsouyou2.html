<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS応用課題2</title>
    <link rel="stylesheet" href="jsouyou2.css" />
  </head>
  <body>
    <div class="background">
      <div class="main-container">
        <div class="circle-container">
          <div class="red-container">
            <button type="button" class="btnLeft">⇦</button>
            <p class="circle red"></p>
            <button type="button" class="btnRight">⇨</button>
          </div>
          <div class="blue-container">
            <button type="button" class="btnLeft">⇦</button>
            <p class="circle blue"></p>
            <button type="button" class="btnRight">⇨</button>
          </div>
          <div class="yellow-container">
            <button type="button" class="btnLeft">⇦</button>
            <p class="circle yellow"></p>
            <button type="button" class="btnRight">⇨</button>
          </div>
          <div class="pink-container">
            <button type="button" class="btnLeft">⇦</button>
            <p class="circle pink"></p>
            <button type="button" class="btnRight">⇨</button>
          </div>
        </div>
        <div class="square-container">
          <p class="square-red"></p>
          <p class="square-blue"></p>
          <p class="square-yellow"></p>
          <p class="square-pink"></p>
        </div>
      </div>
      <p class="text">0個正解しています。</p>
      <button type="button">スタート</button>
      <button type="button" id="resetBtn">リセット</button>
    </div>
    <script src="jsouyou2.js"></script>
  </body>
</html>
