<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>非同期処理課題2</title>
  </head>
  <body>

    <!-- 一覧画面 -->
    <div id="listView">
      <div class="pokemonList">
        <h1>ポケモン一覧</h1>

        <!-- ポケモン一覧を表示する場所 -->
        <ul id="pokemonList"></ul>

        <!-- ローディング表示（初期状態は非表示） -->
        <div id="listLoading" class="loading" style="display: none;">ローディング中...</div>

        <!-- ページネーション -->
        <div id="pagination" class="pagination">
          <button id="prevBtn">前へ</button>
          <span id="pageNum">1</span>
          <button id="nextBtn">次へ</button>
        </div>
      </div>

      <!-- 検索機能 -->
      <div class="searchContainer">
        <div class="searchMain">
          <h2>ポケモン検索</h2>
          <div class="searchForm">
            <input type="number" id="searchInput" placeholder="ポケモンIDを入力してください">
            <button id="searchBtn" disabled>検索</button>
          </div>

          <!-- 検索用ローディング -->
          <div id="searchLoading" class="loading" style="display: none;">ローディング中...</div>

          <!-- エラーメッセージ表示 -->
          <div id="errorMessage" class="errorMessage"></div>
        </div>

        <!-- 履歴機能（画面右側） -->
        <div class="searchSidebar">
          <h3>検索履歴</h3>
          <div id="historyContainer" class="historyScroll"></div>
        </div>
      </div>
    </div>

    <!-- 詳細画面 -->
    <!-- URLに ?name=xxx が付いているときだけ表示する -->
    <div id="detailView" hidden>
      <!-- 一覧に戻るリンク -->
      <p><a href="index.html">← 一覧に戻る</a></p>

      <!-- ローディング表示 -->
      <div id="detailLoading" class="loading" style="display: none;">詳細データを読み込み中...</div>

      <!-- 詳細情報を表示 -->
      <div id="pokemonDetailContainer">
        <h1 id="pokemonTitle">---</h1>
        <div>
          <img id="pokemonImage" src="" alt="ポケモンの画像" style="min-height: 100px;">
        </div>
        <p id="pokemonId">ID: --</p>
        <p id="pokemonHeight">高さ: --</p>
        <p id="pokemonWeight">重さ: --</p>
        <p id="pokemonTypes">タイプ: --</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
