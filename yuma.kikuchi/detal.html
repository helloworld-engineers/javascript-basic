<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="detal.css">
  <title>ポケモン詳細画面</title>
</head>
<body>
  <div class="container">
    <div class="card-header">
          <h2 id="pokemon-name" class="pokemon-name">name</h2>
          <span id="pokemon-id" class="pokemon-id">ID:--</span>
        </div>
        <!-- 画像表示 -->
        <div class="card-image-container">
          <img
            id="pokemon-image"
            src=""
            alt="ポケモンの画像"
            class="pokemon-image"
          />
        </div>
        <!-- 詳細情報リスト -->
        <div class="card-body">
          <dl class="info-list">
            <div class="info-item">
              <dt>タイプ</dt>
              <dd id="pokemon-types" class="pokemon-types">--</dd>
            </div>
            <div class="info-item">
              <dt>高さ</dt>
              <dd id="pokemon-height">--</dd>
            </div>
            <div class="info-item">
              <dt>重さ</dt>
              <dd id="pokemon-weight">--</dd>
            </div>
          </dl>
  </div>
  <script src="detal.js"></script>
</body>
</html>
