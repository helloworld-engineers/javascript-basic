<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>非同期処理②</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="main">
      <div class="title">
        <h2>ポケモン一覧</h2>
      </div>

      <div class="pageBtns">
        <div class="btn" id="before">
          <button id="beforeBtn" type="button">前へ</button>
        </div>
        <div class="btn" id="pageNum"></div>
        <div class="btn">
          <button id="nextBtn" type="button">次へ</button>
        </div>
      </div>
      <p class="loadingText" id="loadingText"></p>
      <div class="pokemonDetail" id="pokemonDetail"></div>
    </main>

    <div class="rightBlock">
      <div class="search" id="search">
        <input
          class="searchId"
          id="searchId"
          type="text"
          placeholder="idを入力してください"
        />
        <button type="button" class="searchBtn" id="searchBtn">検索</button>
      </div>
      <div class="searchLoading hide" id="searchLoading">読み込み中…</div>
      <div class="errorMsg" id="errorMsg"></div>

      <div class="searchCard"></div>

      <div>
        <div>
          <p>検索履歴</p>
        </div>
        <div class="searchLog" id="searchLog"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
