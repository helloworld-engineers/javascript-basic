<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Javascript総合課題</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="body">
      <main class="main">
        <div class="status" id="status">
          <p>HP:100</p>
          <p>攻撃力:10</p>
          <p>レベル:1</p>
        </div>
        <div class="mainCharactor" id="mainCharactor">
          <img src="./Images/MainCharactor.png" alt="主人公画像" />
        </div>
        <div class="arrowsArea">
          <div class="arrowsBox">
            <div></div>
            <img class="up" src="./Images/UpArrow.png" alt="上矢印" />
            <div></div>
            <img class="left" src="./Images/LeftArrow.png" alt="左矢印" />
            <div></div>
            <img class="right" src="./Images/RightArrow.png" alt="右矢印" />
            <div></div>
            <img class="down" src="./Images/DownArrow.png" alt="下矢印" />
            <div></div>
          </div>
        </div>
      </main>

      <div class="log">
        <p>ログ</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
