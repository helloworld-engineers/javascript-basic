<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Javascript総合課題</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="body">
      <main class="main">
        <div class="status" id="status">
          <p id="HP"></p>
          <p id="Attack"></p>
          <p id="Level"></p>
        </div>
        <div class="mainImage">
          <img
            id="currentImage"
            src="./images/MainCharactor.png"
            alt="主人公画像"
          />
        </div>
        <div class="buttonsArea">
          <div class="arrowsBox">
            <div></div>
            <button class="moveArrow" id="upArrow" type="button">
              <img src="./images/UpArrow.png" alt="上矢印" />
            </button>
            <div></div>
            <button class="moveArrow" id="leftArrow" type="button">
              <img src="./images/LeftArrow.png" alt="左矢印" />
            </button>
            <div></div>
            <button class="moveArrow" id="rightArrow" type="button">
              <img src="./images/RightArrow.png" alt="右矢印" />
            </button>
            <div></div>
            <button class="moveArrow" id="downArrow" type="button">
              <img src="./images/DownArrow.png" alt="下矢印" />
            </button>
            <div></div>
          </div>
          <div class="battle">
            <button class="hide" id="battleButton">戦う</button>
          </div>
          <div class="escape">
            <button class="hide" id="escapeButton">逃げる</button>
          </div>
        </div>
      </main>

      <div class="log" id="log">
        <h4>ログ</h4>
        <p></p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
